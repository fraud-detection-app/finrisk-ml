# Move ONE registered model version through the four environments: dev -> sit -> pre-prod -> prod.
#
# Each job writes the environment's model pointer in SSM (/finrisk/<env>/model), then waits until the RUNNING
# app answers /ready with that model version. The app never restarts and is never rebuilt: it re-reads its
# pointer on a timer and swaps the new model in. So a model release and an app release are separate things.
#
#   promote-dev -> promote-sit -> promote-pre-prod -> promote-prod
#
#   dev, sit          accept any version that is not Rejected (a person may want to look at it before approving)
#   pre-prod, prod    accept only an Approved version (approve-model.yml). Each has a required reviewer too.
#
# Roll back = run this again with the previous version number. Same jobs, same approvals.
#
# What this workflow needs: ONE secret NAME, AWS_ROLE_ARN, set in each Environment with that environment's role
# (each role may only touch /finrisk/<env>/*). A job with `environment:` reads its own Environment's secret.
# ------------------------------------------------------------------------------------------------------
#   name                  kind      where                   what
#   AWS_ROLE_ARN          secret    Environment `dev`       role finrisk-ml-promote-dev
#   AWS_ROLE_ARN          secret    Environment `sit`       role finrisk-ml-promote-sit
#   AWS_ROLE_ARN          secret    Environment `pre-prod`  role finrisk-ml-promote-pre-prod   (reviewer)
#   AWS_ROLE_ARN          secret    Environment `prod`      role finrisk-ml-promote-prod       (reviewer)
#   AWS_REGION            variable  repository              ap-southeast-2
name: promote-model

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Model version number to promote (see list in the approve-model run)"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: promote-model # one promotion at a time: two runs would fight over the same pointers
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  promote-dev:
    name: promote to dev
    runs-on: ubuntu-latest
    timeout-minutes: 25 # the readiness wait inside is 10 minutes at most
    environment: dev
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check the version number
        run: |
          [[ "$VERSION" =~ ^[0-9]+$ ]] || { echo "::error::version must be a whole number, not '$VERSION'"; exit 1; }

      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: promote-dev-${{ github.run_id }}

      # Secrets are hidden already; this also hides the NEW strings built from the account id in what AWS prints.
      - name: Hide the account id in what AWS prints
        run: |
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          echo "::add-mask::$ACCOUNT_ID"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Promote model version ${{ inputs.version }} to dev
        run: |
          pip install --quiet -r requirements.txt
          python pipeline/mlops.py promote --env dev --version "$VERSION" --summary "$GITHUB_STEP_SUMMARY"

  promote-sit:
    name: promote to sit
    runs-on: ubuntu-latest
    timeout-minutes: 25 # the readiness wait inside is 10 minutes at most
    needs: promote-dev
    environment: sit
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check the version number
        run: |
          [[ "$VERSION" =~ ^[0-9]+$ ]] || { echo "::error::version must be a whole number, not '$VERSION'"; exit 1; }

      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: promote-sit-${{ github.run_id }}

      # Secrets are hidden already; this also hides the NEW strings built from the account id in what AWS prints.
      - name: Hide the account id in what AWS prints
        run: |
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          echo "::add-mask::$ACCOUNT_ID"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Promote model version ${{ inputs.version }} to sit
        run: |
          pip install --quiet -r requirements.txt
          python pipeline/mlops.py promote --env sit --version "$VERSION" --summary "$GITHUB_STEP_SUMMARY"

  promote-pre-prod:
    name: promote to pre-prod
    runs-on: ubuntu-latest
    timeout-minutes: 25 # the readiness wait inside is 10 minutes at most
    needs: promote-sit
    environment: pre-prod
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check the version number
        run: |
          [[ "$VERSION" =~ ^[0-9]+$ ]] || { echo "::error::version must be a whole number, not '$VERSION'"; exit 1; }

      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: promote-pre-prod-${{ github.run_id }}

      # Secrets are hidden already; this also hides the NEW strings built from the account id in what AWS prints.
      - name: Hide the account id in what AWS prints
        run: |
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          echo "::add-mask::$ACCOUNT_ID"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Promote model version ${{ inputs.version }} to pre-prod
        run: |
          pip install --quiet -r requirements.txt
          python pipeline/mlops.py promote --env pre-prod --version "$VERSION" --summary "$GITHUB_STEP_SUMMARY"

  promote-prod:
    name: promote to prod
    runs-on: ubuntu-latest
    timeout-minutes: 25 # the readiness wait inside is 10 minutes at most
    needs: promote-pre-prod
    environment: prod
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check the version number
        run: |
          [[ "$VERSION" =~ ^[0-9]+$ ]] || { echo "::error::version must be a whole number, not '$VERSION'"; exit 1; }

      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: promote-prod-${{ github.run_id }}

      # Secrets are hidden already; this also hides the NEW strings built from the account id in what AWS prints.
      - name: Hide the account id in what AWS prints
        run: |
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          echo "::add-mask::$ACCOUNT_ID"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Promote model version ${{ inputs.version }} to prod
        run: |
          pip install --quiet -r requirements.txt
          python pipeline/mlops.py promote --env prod --version "$VERSION" --summary "$GITHUB_STEP_SUMMARY"
